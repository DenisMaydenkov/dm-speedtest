<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speed test — by dmworks</title>
<meta name="description" content="Скорость интернета и проверка VPN: пинг, загрузка, отдача, утечки WebRTC.">
<meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Before first paint, so there is no flash of the wrong theme or language.
  (function () {
    var t = 'auto', l = null;
    try { t = localStorage.getItem('theme') || 'auto'; l = localStorage.getItem('lang'); } catch (e) {}
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (!l) l = (navigator.languages || [navigator.language]).some(function (x) { return /^(ru|uk|be|kk)\b/i.test(x); }) ? 'ru' : 'en';
    document.documentElement.lang = l;
  })();
</script>
<script type="module" src="app.js"></script>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <svg class="mark" viewBox="0 0 143 143" fill="currentColor" aria-hidden="true"><path d="M142.337 142.337H71.1687C110.474 142.337 142.337 110.474 142.337 71.1687C142.337 31.8632 110.474 0 71.1687 0C31.8634 0.000330547 0.000330526 31.8634 0 71.1687C0 110.474 31.8632 142.337 71.1687 142.337H0V0H142.337V142.337Z"/><path d="M19.6957 101.275H38.5147V120.094H19.6957V101.275Z"/><path d="M76.1477 48.585H94.9654V120.092H76.1477V48.585Z"/><path d="M104.378 22.2408H123.196V120.093H104.378V22.2408Z"/><path d="M47.9213 74.9306H66.739V120.093H47.9213V74.9306Z"/></svg>
    <div class="brand"><b>Speed test</b><small>by dmworks</small></div>
    <a class="tg" href="https://t.me/dmworks" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.5 4.5 2.5 11.8l6.2 2.1 2.3 6.6 3.4-4.1 5.3 4z"/><path d="m8.7 13.9 8.8-6.4-6.5 8.9"/></svg><span>Telegram</span></a>
    <button class="pill wait" id="vpnPill" type="button"><span id="vpnText">…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ib txt" id="langBtn" type="button">EN</button>
    <button class="ib" id="themeBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" id="themeIcon"></svg></button>
  </header>

  <section class="box" id="box" aria-live="polite">
    <div class="fill"></div>
    <div class="box-in">
      <div class="box-top"><span class="phase"><i class="dot"></i><span id="phase"></span></span><span id="scale"></span></div>
      <div class="num"><span id="big">0</span><span id="unit"></span></div>
    </div>
  </section>

  <div class="steps" id="steps" aria-hidden="true">
    <div data-step="latency"><span class="bar"><i></i></span><span data-t="ping"></span></div>
    <div data-step="download"><span class="bar"><i></i></span><span data-t="download"></span></div>
    <div data-step="upload"><span class="bar"><i></i></span><span data-t="upload"></span></div>
  </div>

  <div class="tiles">
    <div class="tile"><span class="k" data-t="upload"></span><span class="v" id="vUp">—</span></div>
    <div class="tile"><span class="k" data-t="ping"></span><span class="v" id="vPing">—</span></div>
    <div class="tile"><span class="k" data-t="jitter"></span><span class="v" id="vJit">—</span></div>
    <button class="conn" id="connBtn" type="button">
      <span class="conn-t"><b id="connMain">…</b><small id="connSub"></small></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="warn" id="warn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg><span data-t="warnRu"></span></div>

  <div class="actions">
    <button class="main" id="goBtn" type="button"></button>
    <button class="nodeb" id="nodeBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg><span id="nodeText"></span></button>
    <button class="share" id="shareBtn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span data-t="share"></span></button>
    <p class="foot" id="foot"></p>
  </div>
</main>

<dialog class="sheet" id="sheet">
  <div class="grab"></div>
  <h2 id="sTitle"></h2>
  <p class="lead" id="sLead"></p>
  <div class="rows" id="sRows"></div>
  <div class="fix" id="sFix" hidden><h3 data-t="fixTitle"></h3><p data-t="fixText"></p></div>
  <button class="main" id="sClose" type="button" data-t="ok"></button>
</dialog>

<dialog class="sheet" id="nodeSheet">
  <div class="grab"></div>
  <h2 data-t="nodeTitle"></h2>
  <div id="nodePick">
    <div class="node-list" id="nodeList"></div>
    <p class="note"><span data-t="mlabNote"></span> <a href="https://www.measurementlab.net/privacy/" target="_blank" rel="noopener" data-t="mlabPolicy"></a></p>
  </div>
  <div id="nodeConsent" hidden>
    <p class="lead" id="consentText"></p>
    <p class="note"><a href="https://www.measurementlab.net/privacy/" target="_blank" rel="noopener" data-t="mlabPolicy"></a></p>
    <div class="row-btns"><button class="main" id="consentYes" type="button" data-t="agree"></button><button class="ghost" id="consentNo" type="button" data-t="cancel"></button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>
</body>
</html>
